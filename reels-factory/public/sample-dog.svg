<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <rect width="800" height="800" fill="#fde8d7"/>
  <!-- ears -->
  <ellipse cx="235" cy="270" rx="95" ry="150" fill="#a9744f" transform="rotate(-18 235 270)"/>
  <ellipse cx="565" cy="270" rx="95" ry="150" fill="#a9744f" transform="rotate(18 565 270)"/>
  <!-- head -->
  <circle cx="400" cy="420" r="240" fill="#d9a066"/>
  <!-- muzzle -->
  <ellipse cx="400" cy="510" rx="130" ry="100" fill="#f3d5ae"/>
  <!-- eyes -->
  <circle cx="320" cy="390" r="30" fill="#3b2b20"/>
  <circle cx="480" cy="390" r="30" fill="#3b2b20"/>
  <circle cx="330" cy="380" r="9" fill="#fff"/>
  <circle cx="490" cy="380" r="9" fill="#fff"/>
  <!-- nose -->
  <ellipse cx="400" cy="480" rx="34" ry="24" fill="#3b2b20"/>
  <!-- mouth -->
  <path d="M400 505 Q400 545 360 550" stroke="#3b2b20" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M400 505 Q400 545 440 550" stroke="#3b2b20" stroke-width="10" fill="none" stroke-linecap="round"/>
  <!-- tongue -->
  <path d="M375 552 Q400 600 425 552 Z" fill="#e86a8a"/>
  <!-- blush -->
  <circle cx="265" cy="470" r="26" fill="#f2b8a0" opacity="0.8"/>
  <circle cx="535" cy="470" r="26" fill="#f2b8a0" opacity="0.8"/>
  <text x="400" y="740" text-anchor="middle" font-family="sans-serif" font-size="34" fill="#a9744f">sample dog photo</text>
</svg>
